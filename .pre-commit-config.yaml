repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: eslint
        name: eslint (fix)
        language: system
        entry: pnpm exec eslint --fix
        files: ^src/.*\.(ts|tsx|js|jsx)$

      - id: prettier
        name: prettier (write)
        language: system
        entry: pnpm exec prettier --write
        files: ^(src/.*\.(ts|tsx|js|jsx|css|scss)|.*\.(md|json|ya?ml))$

      - id: typecheck
        name: typescript typecheck
        language: system
        entry: pnpm exec tsc -p tsconfig.app.json --noEmit
        pass_filenames: false

  - repo: local
    hooks:
      - id: commitlint
        name: commitlint (conventional)
        language: system
        entry: pnpm commitlint --edit
        stages: [commit-msg]

exclude: ^(node_modules|dist|coverage)/
